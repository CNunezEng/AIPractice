# Test Cases Configuration File
# Format: INI-style configuration with test case definitions
# Each test case is a section with parameters defining the test

# Message Creation Tests
[test_creation_valid_inputs]
type=creation
sender=user1
content=Hello
expected_result=valid
description=Create message with valid inputs

[test_creation_with_spaces]
type=creation
sender=  user1  
content=  Hello  
expected_result=valid_trim
description=Create message with leading/trailing spaces

# Message Validation Tests
[test_validation_valid_message]
type=validation
sender=user1
content=Hello world
expected_result=valid
description=Validate message with valid input

[test_validation_empty_sender]
type=validation
sender=
content=Hello
expected_result=invalid
error_contains=empty
description=Validate empty sender

[test_validation_empty_content]
type=validation
sender=user1
content=
expected_result=invalid
error_contains=empty
description=Validate empty content

[test_validation_sender_too_long]
type=validation
sender=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
content=Hello
expected_result=invalid
error_contains=exceed|64
description=Validate sender exceeds max length (65 chars, max 64)

[test_validation_content_too_long]
type=validation
sender=user1

expected_result=invalid
error_contains=exceed|4096
description=Validate content exceeds max length (4097 chars, max 4096)

[test_validation_invalid_characters]
type=validation
sender=user@1
content=Hello
expected_result=invalid
error_contains=alphanumeric|letter
description=Validate sender with invalid characters

[test_validation_underscore_allowed]
type=validation
sender=user_1
content=Hello
expected_result=valid
description=Validate sender with underscore (allowed)

[test_validation_hyphen_allowed]
type=validation
sender=user-1
content=Hello
expected_result=valid
description=Validate sender with hyphen (allowed)

[test_validation_numbers_allowed]
type=validation
sender=user123
content=Hello
expected_result=valid
description=Validate sender with numbers (allowed)

# Message Serialization Tests
[test_serialization_roundtrip]
type=serialization
sender=alice
content=Test message
expected_result=roundtrip_match
description=Serialize and deserialize roundtrip

[test_deserialization_invalid]
type=deserialization
input_data=x
input_size=1
expected_result=empty
description=Deserialize invalid data returns empty

[test_deserialization_empty_buffer]
type=deserialization
input_data=
input_size=0
expected_result=empty
description=Deserialize empty buffer returns empty

[test_serialization_large_message]
type=serialization
sender=user1

expected_result=roundtrip_match
description=Serialize large valid message (4000 chars)

[test_serialization_special_characters]
type=serialization
sender=user1
content=Hello!? @#$%^&*()_+-=[]{}|;:',.<>?/
expected_result=roundtrip_match
description=Serialize message with special characters

# Message Getter Tests
[test_getter_sender_throws]
type=getter
getter_type=sender
sender=
content=Hello
expected_result=throws_exception
exception_type=runtime_error
description=Get sender throws when empty

[test_getter_content_throws]
type=getter
getter_type=content
sender=user1
content=
expected_result=throws_exception
exception_type=runtime_error
description=Get content throws when empty
