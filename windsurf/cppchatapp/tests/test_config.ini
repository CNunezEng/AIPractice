# Test Configuration File for C++ Chat Application
# Following AIinfo.txt standards for configurable testing

[message_tests]
standard_creation = true
custom_type = true
empty_sender = true
empty_content = true
json_serialization = true
json_deserialization = true
max_length = true
too_long = true
special_characters = true
unicode = true

[server_tests]
creation = true
custom_handler = true
start_stop = true
broadcast_running = true
broadcast_not_running = true
invalid_port = true
invalid_host = true
broadcast_invalid = true
client_management = true
multiple_start = true
multiple_stop = true
message_validation = true
multiple_types = true
performance = true

[test_settings]
performance_iterations = 1000
performance_timeout_ms = 1000000
server_ports = 8766,8767,8768,8769,8770,8771,8772,8773,8774,8775
enable_performance_tests = true
enable_integration_tests = true
enable_edge_case_tests = true

[output]
verbose = true
show_performance = true
show_timing = true
